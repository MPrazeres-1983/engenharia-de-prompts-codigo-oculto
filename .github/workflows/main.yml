name: Compilar e validar livro

on:
  push:
    branches: [main, segunda-edicao-2026, terceira-edicao-ia-referencia-2026]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Identificar revisao e validar exemplos offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if re.fullmatch(r'[0-9a-f]{40}', sha) is None:
              raise ValueError('SHA invalido')
          Path('src/revisao.tex').write_text('\\def\\revisao{' + sha + '}\n')
          Path('build/revisao.txt').write_text(sha + '\n')
          PY
          python3 -m unittest discover -s tests -v 2>&1 | tee build/testes.txt
          python3 -m exemplos.lavandaria.avaliar | tee build/avaliacao.json
          python3 scripts/verificar_livro.py | tee build/estrutura.json
          python3 experiencias/llm_local/verificar_registo.py | tee build/registo-llm.json
          python3 -m exemplos.laboratorio.fundamentos | tee build/fundamentos.json
          python3 -m exemplos.laboratorio.decisoes | tee build/decisoes.json
          python3 -m exemplos.laboratorio.adaptacao | tee build/adaptacao.json
          python3 -m exemplos.laboratorio.skills | tee build/skill.json
          python3 -m exemplos.laboratorio.equipas | tee build/controlador.json
          python3 -m exemplos.laboratorio.operacao | tee build/incidente-cache.json
          python3 experiencias/equipas/offline.py --verificar | tee build/equipas-offline.json
          python3 -m compileall -q exemplos scripts tests experiencias

      - name: Compilar LaTeX e BibTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: livro.tex
          working_directory: src
          args: "-pdf -interaction=nonstopmode -halt-on-error -file-line-error"

      - name: Validar referencias e avisos de composicao
        run: python3 scripts/verificar_livro.py --log src/livro.log | tee build/validacao.json

      - name: Guardar PDF e evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Livro-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            src/livro.pdf
            src/livro.log
            src/livro.bbl
            build/
            experiencias/llm_local/resultados/
